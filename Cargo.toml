[package]
name = "blue-dragon"
version = "0.4.0-alpha.2"
edition = "2021"
license = "MIT"
description = "Blue Dragon - cross-platform, consent-first AI coding agent"
repository = "https://github.com/khdertaysh1/khdertaysh1-blue-dragon-agent"

[[bin]]
name = "blue-dragon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
dirs = "6"
similar = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
tempfile = "3"

ratatui = "0.30.2"
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
