name: Blue Dragon — Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Exercise extracted device trial kit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/package_trial_kit.py --output "$RUNNER_TEMP/device-trial.zip"
          python -m zipfile -e "$RUNNER_TEMP/device-trial.zip" "$RUNNER_TEMP/device-trial"
          python "$RUNNER_TEMP/device-trial/scripts/device_trial.py" --binary "$PWD/target/release/blue-dragon" --output "$RUNNER_TEMP/device-trial-results"
      - name: Offline provider selection smoke test
        run: python scripts/smoke_models.py
      - name: Deterministic runtime regression benchmark
        shell: bash
        run: |
          binary=target/release/blue-dragon
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python scripts/benchmark_runtime.py --candidate "$binary" --repeats 1 --output runtime-benchmark.json
          python scripts/test_provider_traffic.py
          python scripts/test_verify_live_provider_capacity.py
          python scripts/test_provider_budget_storage.py "$binary"
          python scripts/test_benchmark_alpha_reads.py
          python scripts/benchmark_alpha_reads.py --blue "$binary" --output common-read-blue.json
          python scripts/test_benchmark_alpha_workflows.py
          python scripts/benchmark_alpha_workflows.py --blue "$binary" --output edit-workflow-blue.json
          python scripts/smoke_review_engines.py "$binary"
          python scripts/smoke_continuity.py "$binary"
          python scripts/smoke_discovery_cycle.py "$binary"
          python scripts/smoke_inspect_exit.py "$binary"
          python scripts/smoke_coverage.py "$binary"
          python scripts/smoke_source_refresh.py "$binary"
          python scripts/smoke_test_coverage.py "$binary"
          python scripts/smoke_delegates.py "$binary"
          python scripts/smoke_delegate_consistency.py "$binary"
          python scripts/smoke_integrated_research.py "$binary"
          python scripts/smoke_mcp_resources.py "$binary"
          python scripts/smoke_memory_sources.py "$binary"
      - name: Preserve comparison diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-diagnostics-${{ runner.os }}
          path: |
            common-read-blue.json
            edit-workflow-blue.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-${{ runner.os }}
          path: runtime-benchmark.json
          if-no-files-found: error
      - name: Real terminal smoke test
        if: runner.os != 'Windows'
        run: |
          python scripts/test_pty_text.py
          python scripts/test_pty_shutdown.py
          python scripts/smoke_tui.py
      - name: Active job shutdown in terminal
        if: runner.os == 'Linux'
        run: python scripts/smoke_job_shutdown.py
      - name: Package release binary
        shell: bash
        run: |
          binary=target/release/blue-dragon
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python scripts/package_binary.py "$binary" "$RUNNER_OS" "$RUNNER_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release-payload/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: blue-dragon-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/blue-dragon
            target/release/blue-dragon.exe
          if-no-files-found: error
          retention-days: 7
  android:
    name: Android ARM64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build with Android NDK
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$ndk" ]]; then
            echo "::error::Android NDK is not available on this runner."
            exit 1
          fi
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --locked --release --target aarch64-linux-android
          mkdir -p android-package
          cp target/aarch64-linux-android/release/blue-dragon android-package/
          (cd android-package && sha256sum blue-dragon > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: blue-dragon-Android-ARM64
          path: android-package/
          if-no-files-found: error
          retention-days: 14

      - name: Package Android release binary
        run: python scripts/package_binary.py target/aarch64-linux-android/release/blue-dragon Android ARM64
      - uses: actions/upload-artifact@v4
        with:
          name: release-Android-ARM64
          path: release-payload/
          if-no-files-found: error
          retention-days: 14
  installer:
    name: Installer safety and upgrade checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: bash -n scripts/install.sh
      - run: python scripts/test_installer.py
      - run: python scripts/test_installer.py
        env:
          TEST_RELEASE_TAG: v0.4.0-alpha.4
      - run: python scripts/test_source_upgrade.py
      - run: python scripts/test_release_payload.py
      - run: python scripts/test_device_trial.py
      - run: python scripts/package_trial_kit.py --output target/blue-dragon-trial-kit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blue-dragon-trial-kit
          path: target/blue-dragon-trial-kit.zip
          if-no-files-found: error
          retention-days: 14
  browser:
    name: Real browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo build --locked --release
      - run: node scripts/test_browser_forms.mjs
      - run: node scripts/test_browser_policy.mjs
      - run: node scripts/test_browser_transport.mjs
      - run: python scripts/build_browser_extension.py
      - name: Extension validation
        run: npx --yes web-ext@10.8.0 lint --source-dir target/browser-extensions/firefox
      - name: Install pinned official test browsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bb-browsers"
          cd "$RUNNER_TEMP/bb-browsers"
          curl -fLS --retry 3 https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.78/linux64/chrome-linux64.zip -o chrome.zip
          unzip -q chrome.zip
          curl -fLS --retry 3 https://archive.mozilla.org/pub/firefox/releases/160.0/linux-x86_64/en-US/firefox-160.0.tar.xz -o firefox.tar.xz
          tar -xf firefox.tar.xz
          curl -fLS --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o geckodriver.tar.gz
          tar -xf geckodriver.tar.gz
          echo "CHROMIUM_BIN=$PWD/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "FIREFOX_BIN=$PWD/firefox/firefox" >> "$GITHUB_ENV"
          echo "GECKODRIVER_BIN=$PWD/geckodriver" >> "$GITHUB_ENV"
      - name: CDP and both real extensions
        run: |
          node scripts/smoke_browser.mjs
          node scripts/smoke_browser.mjs --extension
          node scripts/smoke_browser.mjs --firefox
          node scripts/smoke_url_inspection.mjs
      - name: Package unsigned developer extensions
        run: |
          mkdir -p release-payload
          cp target/browser-extensions/*.xpi target/browser-extensions/*.zip release-payload/
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-extensions
          path: release-payload/
          if-no-files-found: error
          retention-days: 14
  qualification:
    name: Integrated pinned local-lab qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Checkout reviewed loopback lab
        uses: actions/checkout@v4
        with:
          repository: khdertaysh1/Between-Bytes-Web-Labs
          ref: c396c90f2e7ed080f71368ce9edb5cd630098b09
          path: target/reviewed-web-lab
          persist-credentials: false
      - run: cargo build --locked --release
      # Keep run evidence outside the cached Cargo target directory.
      - name: Qualify one candidate binary
        run: python scripts/qualify_local.py --binary target/release/blue-dragon --lab target/reviewed-web-lab --output "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-local-qualification
          path: ${{ runner.temp }}/qualification-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
  publish:
    name: Publish verified binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, android, installer, browser, qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blue-dragon-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-payload/
      - name: Prepare complete release
        id: prepare
        run: python scripts/prepare_release.py
      - name: Publish after all platforms and installer checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-state.json 2>/dev/null; then
            if jq -e '.draft == false' release-state.json >/dev/null; then
              echo "Release already published; never replacing public binaries. Bump Cargo version for a new release."
              exit 0
            fi
            jq -e --arg sha "$GITHUB_SHA" '.target_commitish == $sha' release-state.json >/dev/null || {
              echo "Draft belongs to another commit; refusing to replace it."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease="$RELEASE_PRERELEASE" \
              --title "Blue Dragon $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-payload/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE"
